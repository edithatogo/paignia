[package]
name = "paignia-solve"
description = "Paignia bounded finite game solvers, with bounded pre-release scope"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[features]
default = []
correlated-equilibrium = ["dep:clarabel"]

[dependencies]
paignia-core = { path = "../paignia-core", version = "0.1.0" }
thiserror = "=1.0.69"
clarabel = { version = "=0.11.1", default-features = false, features = ["serde"], optional = true }

[dev-dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[[test]]
name = "clarabel_backend"
required-features = ["correlated-equilibrium"]

[lints]
workspace = true
