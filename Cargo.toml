[workspace]
resolver = "2"
members = ["crates/paignia-core", "crates/paignia-solve", "crates/paignia-native"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.75"
repository = "https://github.com/edithatogo/paignia"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
