name: Repository Health

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  alint:
    name: alint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign for release verification
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Lint repository structure
        uses: asamarts/alint@5054852d00d47affc9ea71440240147d9999f4d3 # v0.22.1
        env:
          ALINT_REQUIRE_VERIFY: '1'

  repohealth:
    name: RepoHealth report
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check out complete repository history for activity checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate the repository health report
        shell: bash
        env:
          REPOHEALTH_VERSION: '0.5.3'
          REPOHEALTH_SHA256: 68a2fee769ae8f3652d503d07508a91ec1cf73c8463b6846d030762f6d2459d2
        run: |
          tool_dir=$(mktemp -d "$RUNNER_TEMP/repohealth.XXXXXX")
          archive="$tool_dir/repohealth.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            --output "$archive" \
            "https://github.com/spbuilds/repohealth/releases/download/v${REPOHEALTH_VERSION}/repohealth_${REPOHEALTH_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$REPOHEALTH_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$tool_dir" repohealth
          "$tool_dir/repohealth" . --format markdown | tee -a "$GITHUB_STEP_SUMMARY"
