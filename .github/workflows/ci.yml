name: Native CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.75.0"]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/project-python
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Install artifact source isolation
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - name: Cache the full locked metadata closure
        run: cargo fetch --locked
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy with every advertised feature
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Native package tests
        run: cargo test --workspace --all-targets --locked
      - name: Native feature tests and LP backend controls
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --all-targets --all-features --locked 2>&1 | tee target/all-features.log
          python3 scripts/check_cargo_test_log.py target/all-features.log 8 --target tests/clarabel_backend.rs
          python3 scripts/check_cargo_test_log.py target/all-features.log 28 --target tests/correlated_equilibrium.rs
      - name: Native role-separation doctests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p paignia-core --doc 2>&1 | tee target/doctests.log
          python3 scripts/check_cargo_test_log.py target/doctests.log 4 --minimum
      - name: Source ownership and package boundary
        run: python3 scripts/validate_extraction.py --receipt target/static-dependency-boundary.json
      - name: Native solver API doctests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p paignia-solve --doc --all-features 2>&1 | tee target/solver-doctests.log
          python3 scripts/check_cargo_test_log.py target/solver-doctests.log 1 --minimum
      - name: Package and consumer evidence regression controls
        run: python3 -B -m unittest discover -s tests
      - name: Retained independent public-interface and numerical controls
        shell: bash
        env:
          CARGO_TARGET_DIR: target/independent-review-build
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          sys.path.insert(0, "scripts")
          from check_cargo_test_log import check_summary
          targets = [
              ("result_contract_review", 9, []),
              ("replicator_review", 10, []),
              ("mixed_nash_review", 14, []),
              ("conversion_review", 6, []),
              ("correlated_equilibrium_review", 13, ["--features", "correlated-equilibrium"]),
              ("policy_observation_review", 6, []),
          ]
          logs = Path("target/independent-review-logs")
          logs.mkdir(parents=True, exist_ok=True)
          for target, expected, flags in targets:
              command = ["cargo", "test", "--locked", "--manifest-path",
                         f"verification/{target}/Cargo.toml", "--test", "review", *flags]
              run = subprocess.run(command, text=True, stdout=subprocess.PIPE,
                                   stderr=subprocess.STDOUT, check=False)
              (logs / f"{target}.log").write_text(run.stdout)
              print(run.stdout, end="")
              if run.returncode:
                  raise SystemExit(f"Independent tests failed for {target}")
              try:
                  check_summary(run.stdout, expected)
              except ValueError as error:
                  raise SystemExit(f"{target}: {error}") from error
          PY
      - name: Build the reproducible segment benchmark
        run: cargo build --release --locked --manifest-path verification/credal_segment_benchmark/Cargo.toml
      - name: Build and replay the UOGTO interchange case
        shell: bash
        run: |
          cargo fmt --manifest-path crates/paignia-io/Cargo.toml -- --check
          cargo test --locked --manifest-path crates/paignia-io/Cargo.toml --all-targets
          cargo clippy --locked --manifest-path crates/paignia-io/Cargo.toml --all-targets -- -D warnings
          python3 -m pip install --require-hashes --only-binary :all: -r verification/uogto_interchange/requirements.txt
          python3 -I verification/uogto_interchange/interchange.py stage --ontology-dir target/uogto-bundle
          python3 -I verification/uogto_interchange/verify_discounted.py stage --bundle target/uogto-discounted
          cargo fetch --locked --manifest-path crates/paignia-io/Cargo.toml
          bwrap --die-with-parent --unshare-net --dev-bind / / -- bash -euo pipefail <<'REPLAY'
          export UOGTO_BUNDLE=target/uogto-bundle CARGO_NET_OFFLINE=true
          python3 -I -m unittest discover -s verification/uogto_interchange -v
          python3 -I verification/uogto_interchange/verify.py \
            --ontology-dir "$UOGTO_BUNDLE/ontologies/core" --output target/uogto-interchange
          python3 -I verification/uogto_interchange/interchange.py inventory --ontology-dir "$UOGTO_BUNDLE" \
            > target/uogto-interchange/ontology-inventory.json
          python3 -I verification/uogto_interchange/interchange.py roundtrip --ontology-dir "$UOGTO_BUNDLE" \
            --input verification/uogto_interchange/game.ttl --output target/uogto-interchange/game-validated.nt
          python3 -I verification/uogto_interchange/interchange.py roundtrip --ontology-dir "$UOGTO_BUNDLE" \
            --input target/uogto-interchange/result.nt --output target/uogto-interchange/result-validated.nt
          python3 -I verification/uogto_interchange/coverage.py --ontology-dir "$UOGTO_BUNDLE" \
            --output target/uogto-interchange/term-coverage.json
          python3 -I verification/uogto_interchange/verify_profiles.py --ontology-dir "$UOGTO_BUNDLE" \
            --output target/uogto-interchange/profiles
          python3 -I verification/uogto_interchange/verify_discounted.py replay \
            --bundle target/uogto-discounted --output target/uogto-interchange/discounted
          cmp docs/validation/receipts/t22-discounted/receipt.json \
            target/uogto-interchange/discounted/receipt.json
          python3 -I verification/uogto_interchange/verify_consumer.py \
            --output target/uogto-interchange/installed-consumer.json
          CARGO_TARGET_DIR=target cargo build --locked --manifest-path crates/paignia-io/Cargo.toml --example solve
          python3 -I scripts/check_doc_diagrams.py --solver target/debug/examples/solve
          REPLAY
      - name: Cargo artifacts with provider source unavailable
        run: python3 scripts/validate_game_packages.py --receipt target/cargo-artifact-qualification.json --artifact-dir target/qualified-packages
      - name: Native API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-package-qualification-${{ matrix.toolchain }}
          path: |
            target/static-dependency-boundary.json
            target/cargo-artifact-qualification.json
            target/qualified-packages/*.crate
            target/uogto-interchange/
            target/all-features.log
            target/solver-doctests.log
            target/independent-review-logs/*.log
          if-no-files-found: error
          retention-days: 30

  release-hardening:
    name: Release API and wire fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100.0"
      - name: Compare both package APIs with the T19 checkpoint
        shell: bash
        env:
          T19_BASELINE_COMMIT: 0389af46db4557494f465db2c584c80080e9f588
        run: |
          tools=$(mktemp -d "$RUNNER_TEMP/semver.XXXXXX")
          curl --fail --silent --show-error --location --retry 3 --max-time 90 \
            --output "$tools/semver.tar.gz" \
            https://github.com/obi1kenobi/cargo-semver-checks/releases/download/v0.51.0/cargo-semver-checks-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' cacadafaa5cd27ae6d05a74a103266917ebab4c5e43c898360e177d4fbf06a65 "$tools/semver.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$tools/semver.tar.gz" -C "$tools" cargo-semver-checks
          mkdir "$tools/baseline"
          git archive "$T19_BASELINE_COMMIT" | tar -xf - -C "$tools/baseline"
          cargo fetch --locked
          export PATH="$tools:$PATH"
          rustc --version
          cargo semver-checks --version
          for feature_set in --default-features --all-features; do
            CARGO_NET_OFFLINE=true cargo semver-checks \
              --package paignia-core --package paignia-solve \
              --baseline-root "$tools/baseline" "$feature_set"
          done
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: nightly-2026-11-14
      - name: Fuzz both public JSON entry points
        shell: bash
        run: |
          tools=$(mktemp -d "$RUNNER_TEMP/wire-fuzz.XXXXXX")
          curl --fail --silent --show-error --location --retry 3 --max-time 90 \
            --output "$tools/fuzz.tar.gz" \
            https://github.com/rust-fuzz/cargo-fuzz/releases/download/0.13.2/cargo-fuzz-0.13.2-x86_64-unknown-linux-musl.tar.gz
          printf '%s  %s\n' b5b704018b63e0f151c17a057ac53b5111e1db545d1b9f72fee79f08a545931c "$tools/fuzz.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$tools/fuzz.tar.gz" -C "$tools" cargo-fuzz
          mkdir "$tools/corpus"
          cp verification/uogto_interchange/frozen-static-v1/request.json "$tools/corpus/static-v1.json"
          export PATH="$tools:$PATH"
          rustc --version
          cargo fuzz --version
          cargo fetch --locked --manifest-path fuzz/Cargo.toml
          CARGO_NET_OFFLINE=true cargo fuzz run wire_admission "$tools/corpus" \
            --target x86_64-unknown-linux-gnu --target-dir target/wire-fuzz -- \
            -runs=20000 -max_len=16384 -timeout=10 -rss_limit_mb=2048 -seed=1 -print_final_stats=1
          git diff --exit-code -- fuzz/Cargo.lock

  attest-candidate:
    name: Attest qualified candidate archives
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust, rust-coverage, release-hardening]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-package-qualification-1.75.0
          path: ${{ runner.temp }}/release-candidate
      - name: Verify the candidate revision and archive digests
        working-directory: ${{ runner.temp }}/release-candidate
        shell: bash
        run: |
          receipt=cargo-artifact-qualification.json
          jq -e --arg sha "$GITHUB_SHA" '
            .provider_revision == $sha and .provider_worktree_dirty == false and
            .package_inputs_match_revision == true and
            (.artifacts | keys == ["paignia-core", "paignia-solve"])
          ' "$receipt"
          jq -r '.artifacts | to_entries[] |
            "\(.value.archive_sha256)  qualified-packages/\(.key)-\(.value.version).crate"
          ' "$receipt" | sha256sum --check --strict
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/release-candidate/qualified-packages/*.crate
            ${{ runner.temp }}/release-candidate/cargo-artifact-qualification.json

  rust-coverage:
    name: Rust workspace coverage (stable)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: llvm-tools

      - name: Run instrumented workspace tests and report coverage
        shell: bash
        env:
          CARGO_LLVM_COV_VERSION: '0.9.2'
          CARGO_LLVM_COV_SHA256: 1e0ed5c64f11e9217f7b9d7c776b3125eab26f27d49313919c909881a2fc7cff
        run: |
          set -euo pipefail
          tool_dir=$(mktemp -d "$RUNNER_TEMP/cargo-llvm-cov.XXXXXX")
          archive="$tool_dir/cargo-llvm-cov.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            --output "$archive" \
            "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${CARGO_LLVM_COV_VERSION}/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz"
          printf '%s  %s\n' "$CARGO_LLVM_COV_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$tool_dir" cargo-llvm-cov
          export PATH="$tool_dir:$PATH"
          mkdir -p target/coverage
          cargo llvm-cov --locked --workspace --all-targets --all-features \
            --lcov --output-path target/coverage/lcov.info
          test -s target/coverage/lcov.info
          cargo llvm-cov report --locked | tee target/coverage/summary.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-workspace-coverage
          path: target/coverage/
          if-no-files-found: error
          retention-days: 30

  kairos-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.99.0"]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Verify the locked native adapter
        shell: bash
        run: |
          set -euo pipefail
          manifest=crates/paignia-kairos/Cargo.toml
          cargo fetch --locked --manifest-path "$manifest"
          cargo fmt --all --manifest-path "$manifest" -- --check
          cargo clippy --locked --manifest-path "$manifest" --all-targets -- -D warnings
          cargo test --locked --manifest-path "$manifest" --all-targets

  synthetic-oracles:
    name: Synthetic ${{ matrix.suite }} oracles (CPython 3.15.2)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: numerical
            test-file: test_oracles.py
            count: 39
          - suite: inspection
            test-file: test_inspection.py
            count: 28
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/project-python
      - name: Execute all ${{ matrix.count }} synthetic ${{ matrix.suite }} tests
        shell: bash
        env:
          PYTHONNOUSERSITE: "1"
          ORACLE_CORPUS: verification/${{ matrix.suite }}_oracles
          ORACLE_TEST_FILE: ${{ matrix.test-file }}
          ORACLE_TEST_COUNT: ${{ matrix.count }}
          ORACLE_LOG: ${{ matrix.suite }}-oracles.log
        run: |
          set -euo pipefail
          python3 --version | tee "$ORACLE_LOG"
          git rev-parse HEAD 'HEAD^{tree}' | tee -a "$ORACLE_LOG"
          sha256sum "$ORACLE_CORPUS"/* | tee -a "$ORACLE_LOG"
          python3 -B "$ORACLE_CORPUS/$ORACLE_TEST_FILE" 2>&1 | tee -a "$ORACLE_LOG"
          python3 - "$ORACLE_LOG" "$ORACLE_TEST_COUNT" <<'PY'
          from pathlib import Path
          import re
          import sys
          log = Path(sys.argv[1]).read_text()
          count = int(sys.argv[2])
          if not re.search(rf"^Ran {count} tests in [0-9.]+s$", log, re.MULTILINE) or "\nOK\n" not in log:
              raise SystemExit(f"Expected all {count} oracle tests with no failures, errors or skips")
          PY
      - name: Retain synthetic oracle execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-${{ matrix.suite }}-oracles-python-3.15.2
          path: ${{ matrix.suite }}-oracles.log
          if-no-files-found: error
          retention-days: 30
