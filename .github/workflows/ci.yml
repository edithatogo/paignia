name: Native CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.75.0"]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Native package tests
        run: cargo test --workspace --all-targets --locked
      - name: Native role-separation doctests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p paignia-core --doc 2>&1 | tee doctests.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          summaries = re.findall(
              r"^test result: ok\. (\d+) passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;",
              Path("doctests.log").read_text(),
              re.MULTILINE,
          )
          if len(summaries) != 1 or int(summaries[0]) < 3:
              raise SystemExit("Expected at least the three role-separation doctests without skips or failures")
          PY
      - name: Source ownership and package boundary
        run: python3 scripts/validate_extraction.py
      - name: Isolated extracted-source consumer
        run: python3 scripts/validate_game_packages.py --receipt target/extracted-package-smoke.json
      - name: Native API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extracted-package-smoke-${{ matrix.toolchain }}
          path: target/extracted-package-smoke.json
          if-no-files-found: error
          retention-days: 30

  numerical-oracles:
    name: Synthetic numerical oracles (CPython 3.12.14)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.14"
      - name: Execute all 39 synthetic oracle tests
        shell: bash
        env:
          PYTHONNOUSERSITE: "1"
        run: |
          set -euo pipefail
          python3 --version | tee numerical-oracles.log
          git rev-parse HEAD 'HEAD^{tree}' | tee -a numerical-oracles.log
          sha256sum verification/numerical_oracles/* | tee -a numerical-oracles.log
          python3 -B verification/numerical_oracles/test_oracles.py 2>&1 | tee -a numerical-oracles.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          log = Path("numerical-oracles.log").read_text()
          if not re.search(r"^Ran 39 tests in [0-9.]+s$", log, re.MULTILINE) or "\nOK\n" not in log:
              raise SystemExit("Expected all 39 oracle tests with no failures, errors or skips")
          PY
      - name: Retain synthetic oracle execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-numerical-oracles-python-3.12.14
          path: numerical-oracles.log
          if-no-files-found: error
          retention-days: 30
