name: Native CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.75.0"]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/project-python
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Install artifact source isolation
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - name: Cache the full locked metadata closure
        run: cargo fetch --locked
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy with every advertised feature
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Native package tests
        run: cargo test --workspace --all-targets --locked
      - name: Native feature tests and LP backend controls
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --all-targets --all-features --locked 2>&1 | tee target/all-features.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          log = Path("target/all-features.log").read_text()
          backend = re.search(
              r"Running[^\n]*tests/clarabel_backend\.rs[^\n]*\n(.*?test result:[^\n]+)",
              log, re.DOTALL,
          )
          required = "test result: ok. 8 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;"
          if backend is None or required not in backend.group(1):
              raise SystemExit("Expected all eight optional native LP backend controls without skips or failures")
          ce = re.search(
              r"Running[^\n]*tests/correlated_equilibrium\.rs[^\n]*\n(.*?test result:[^\n]+)",
              log, re.DOTALL,
          )
          required_ce = "test result: ok. 28 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;"
          if ce is None or required_ce not in ce.group(1):
              raise SystemExit("Expected all 28 optional native CE controls without skips or failures")
          PY
      - name: Native role-separation doctests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p paignia-core --doc 2>&1 | tee target/doctests.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          summaries = re.findall(
              r"^test result: ok\. (\d+) passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;",
              Path("target/doctests.log").read_text(),
              re.MULTILINE,
          )
          if len(summaries) != 1 or int(summaries[0]) < 4:
              raise SystemExit("Expected the three role-separation and one observation-boundary doctests without skips or failures")
          PY
      - name: Source ownership and package boundary
        run: python3 scripts/validate_extraction.py --receipt target/static-dependency-boundary.json
      - name: Native solver API doctests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p paignia-solve --doc --all-features 2>&1 | tee target/solver-doctests.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          summaries = re.findall(
              r"^test result: ok\. (\d+) passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;",
              Path("target/solver-doctests.log").read_text(),
              re.MULTILINE,
          )
          if len(summaries) != 1 or int(summaries[0]) < 1:
              raise SystemExit("Expected the native mixed Nash API example without skips or failures")
          PY
      - name: Package and consumer evidence regression controls
        run: python3 -B -m unittest discover -s tests
      - name: Retained independent public-interface and numerical controls
        shell: bash
        env:
          CARGO_TARGET_DIR: target/independent-review-build
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          targets = [
              ("result_contract_review", 9, []),
              ("replicator_review", 10, []),
              ("mixed_nash_review", 14, []),
              ("conversion_review", 6, []),
              ("correlated_equilibrium_review", 13, ["--features", "correlated-equilibrium"]),
              ("policy_observation_review", 6, []),
          ]
          logs = Path("target/independent-review-logs")
          logs.mkdir(parents=True, exist_ok=True)
          for target, expected, flags in targets:
              command = ["cargo", "test", "--locked", "--manifest-path",
                         f"verification/{target}/Cargo.toml", "--test", "review", *flags]
              run = subprocess.run(command, text=True, stdout=subprocess.PIPE,
                                   stderr=subprocess.STDOUT, check=False)
              (logs / f"{target}.log").write_text(run.stdout)
              print(run.stdout, end="")
              summaries = re.findall(
                  r"^test result: ok\. (\d+) passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;",
                  run.stdout, re.MULTILINE,
              )
              if run.returncode or summaries != [str(expected)]:
                  raise SystemExit(f"Expected exactly {expected} passing independent tests for {target}")
          PY
      - name: Isolated extracted-source consumer
        run: python3 scripts/validate_game_packages.py --source-smoke --receipt target/extracted-package-smoke.json
      - name: Cargo artifacts with provider source unavailable
        run: python3 scripts/validate_game_packages.py --receipt target/cargo-artifact-qualification.json --artifact-dir target/qualified-packages
      - name: Native API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-package-qualification-${{ matrix.toolchain }}
          path: |
            target/static-dependency-boundary.json
            target/extracted-package-smoke.json
            target/cargo-artifact-qualification.json
            target/qualified-packages/*.crate
            target/all-features.log
            target/solver-doctests.log
            target/independent-review-logs/*.log
          if-no-files-found: error
          retention-days: 30

  rust-coverage:
    name: Rust workspace coverage (stable)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: llvm-tools

      - name: Run instrumented workspace tests and report coverage
        shell: bash
        env:
          CARGO_LLVM_COV_VERSION: '0.9.2'
          CARGO_LLVM_COV_SHA256: 1e0ed5c64f11e9217f7b9d7c776b3125eab26f27d49313919c909881a2fc7cff
        run: |
          set -euo pipefail
          tool_dir=$(mktemp -d "$RUNNER_TEMP/cargo-llvm-cov.XXXXXX")
          archive="$tool_dir/cargo-llvm-cov.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            --output "$archive" \
            "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${CARGO_LLVM_COV_VERSION}/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz"
          printf '%s  %s\n' "$CARGO_LLVM_COV_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$tool_dir" cargo-llvm-cov
          export PATH="$tool_dir:$PATH"
          mkdir -p target/coverage
          cargo llvm-cov --locked --workspace --all-targets --all-features \
            --lcov --output-path target/coverage/lcov.info
          test -s target/coverage/lcov.info
          cargo llvm-cov report --locked | tee target/coverage/summary.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-workspace-coverage
          path: target/coverage/
          if-no-files-found: error
          retention-days: 30

  kairos-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.99.0"]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Verify the locked native adapter
        shell: bash
        run: |
          set -euo pipefail
          manifest=crates/paignia-kairos/Cargo.toml
          cargo fetch --locked --manifest-path "$manifest"
          cargo fmt --all --manifest-path "$manifest" -- --check
          cargo clippy --locked --manifest-path "$manifest" --all-targets -- -D warnings
          cargo test --locked --manifest-path "$manifest" --all-targets

  numerical-oracles:
    name: Synthetic numerical oracles (CPython 3.15.2)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/project-python
      - name: Execute all 39 synthetic oracle tests
        shell: bash
        env:
          PYTHONNOUSERSITE: "1"
        run: |
          set -euo pipefail
          python3 --version | tee numerical-oracles.log
          git rev-parse HEAD 'HEAD^{tree}' | tee -a numerical-oracles.log
          sha256sum verification/numerical_oracles/* | tee -a numerical-oracles.log
          python3 -B verification/numerical_oracles/test_oracles.py 2>&1 | tee -a numerical-oracles.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          log = Path("numerical-oracles.log").read_text()
          if not re.search(r"^Ran 39 tests in [0-9.]+s$", log, re.MULTILINE) or "\nOK\n" not in log:
              raise SystemExit("Expected all 39 oracle tests with no failures, errors or skips")
          PY
      - name: Retain synthetic oracle execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-numerical-oracles-python-3.15.2
          path: numerical-oracles.log
          if-no-files-found: error
          retention-days: 30

  inspection-oracles:
    name: Synthetic inspection oracles (CPython 3.15.2)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/project-python
      - name: Execute all 28 synthetic inspection tests
        shell: bash
        env:
          PYTHONNOUSERSITE: "1"
        run: |
          set -euo pipefail
          python3 --version | tee inspection-oracles.log
          git rev-parse HEAD 'HEAD^{tree}' | tee -a inspection-oracles.log
          sha256sum verification/inspection_oracles/* | tee -a inspection-oracles.log
          python3 -B verification/inspection_oracles/test_inspection.py 2>&1 | tee -a inspection-oracles.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          log = Path("inspection-oracles.log").read_text()
          if not re.search(r"^Ran 28 tests in [0-9.]+s$", log, re.MULTILINE) or "\nOK\n" not in log:
              raise SystemExit("Expected all 28 inspection tests with no failures, errors or skips")
          PY
      - name: Retain synthetic inspection execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-inspection-oracles-python-3.15.2
          path: inspection-oracles.log
          if-no-files-found: error
          retention-days: 30
